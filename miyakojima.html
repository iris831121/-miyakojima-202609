* { box-sizing: border-box; margin: 0; padding: 0; }

.wrap { max-width: 430px; margin: 0 auto; }

/* Hero */
.hero {

  position: relative;
  overflow: hidden;
}
.hero-wave {

.hero-label { font-size: 11px; letter-spacing: 3px; color: #A8E6EF; font-weight: 600; margin-bottom: 6px; }
.hero-title { font-size: 36px; font-weight: 900; color: #fff; margin-bottom: 4px; }
.hero-date { font-size: 13px; color: #C8F0F5; margin-bottom: 24px; }
.hero-illust {
  position: absolute; right: 20px; top: 24px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;

/* Tabs */
.tabs-wrap { background: #F5F0EB; padding: 16px 16px 0; }
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 10px 16px;
  border-radius: 50px;
  border: 2px solid #D0C8BF;
  cursor: pointer;
  background: #FFF;
  text-align: center;
  transition: all 0.2s;
  min-width: 72px;
}
.tab.active {
  background: #1A5F7A;
  border-color: #1A5F7A;
  color: #fff;
}
.tab-day { font-size: 14px; font-weight: 800; color: inherit; }
.tab-date { font-size: 10px; color: #9E8E80; margin-top: 1px; }
.tab.active .tab-date { color: #A8E6EF; }

/* Day header */
.day-header {
  padding: 20px 20px 12px;
  background: #F5F0EB;
}
.day-num { font-size: 52px; font-weight: 900; color: #1A5F7A; line-height: 1; }
.day-num span { font-size: 22px; color: #9E8E80; }
.day-weekday { font-size: 12px; color: #9E8E80; margin-top: 2px; letter-spacing: 1px; }
.day-subtitle { font-size: 18px; font-weight: 900; color: #2C2010; margin-top: 4px; }
.day-hotel {
  margin-top: 10px;
  background: #fff;
  border-radius: 14px;
  padding: 12px 14px;
  border: 1.5px solid #E0D8D0;

.hotel-label { font-size: 10px; font-weight: 700; color: #9E8E80; letter-spacing: 1px; margin-bottom: 4px; }
.hotel-name { font-size: 14px; font-weight: 800; color: #2C2010; margin-bottom: 2px; }
.hotel-price { font-size: 12px; color: #1A5F7A; font-weight: 600; }
.hotel-note { font-size: 11px; color: #C47A50; margin-top: 3px; }

/* Timeline */
.timeline { padding: 0 16px 32px; position: relative; }
.timeline::before {
  content: '';
  position: absolute;
  left: 36px; top: 0; bottom: 0;
  width: 2px;
  background: linear-gradient(#4ABBC4, #1A5F7A88);

.tl-item { display: flex; gap: 12px; margin-bottom: 16px; position: relative; }
.tl-time {
  flex-shrink: 0; width: 40px;

.tl-dot-wrap {

.tl-dot.blue-outline { background: #F5F0EB; border: 2px solid #1A5F7A; box-shadow: 0 0 0 2px #1A5F7A; }
.tl-card {

var map = null;
var mapLayers = [];

function initMap(dayIndex) {
  if (!map) {
    map = L.map('trip-map', { zoomControl: true, attributionControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 14
    }).addTo(map);
  }
  // Clear previous layers
  mapLayers.forEach(function(l){ map.removeLayer(l); });
  mapLayers = [];

  var coords = DAY_COORDS[dayIndex];
  if (!coords || coords.length === 0) return;

  var latlngs = [];
  coords.forEach(function(pt, i) {
    var latlng = [pt.lat, pt.lng];
    latlngs.push(latlng);

    var icon = L.divIcon({
      className: '',
      html: '<div style="background:#1A5F7A;color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.35);">' + (i+1) + '</div>',
      iconSize: [30, 30],
      iconAnchor: [15, 15],
    });

    var marker = L.marker(latlng, {icon: icon})
      .bindPopup(
        '<div style="text-align:center;padding:6px 4px;">'
        + '<div style="font-size:14px;font-weight:900;color:#1A1A1A;margin-bottom:8px;">' + pt.icon + ' ' + pt.name + '</div>'
        + (pt.map
          ? '<a href="' + pt.map + '" target="_blank" onclick="event.stopPropagation();" style="display:inline-block;background:#1A5F7A;color:white;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none;">📍 Google Maps</a>'
          : '<span style="font-size:11px;color:#9E8E80;">集合點待定</span>')
        + '</div>',
        {maxWidth: 200, closeButton: true})
      .addTo(map);
    mapLayers.push(marker);
  });

  // Draw route line
  if (latlngs.length > 1) {
    var line = L.polyline(latlngs, {
      color: '#1A5F7A', weight: 2.5,
      dashArray: '6, 6', opacity: 0.7
    }).addTo(map);
    mapLayers.push(line);
    map.fitBounds(line.getBounds(), {padding: [30, 30]});
  } else {
    map.setView(latlngs[0], 13);
  }
}

var active = 0;

function render() {
  var tabsEl = document.getElementById('tabs');
  var contentEl = document.getElementById('content');

  var tabsHtml = '';
  for (var i = 0; i < DAYS.length; i++) {
    var d = DAYS[i];
    var ac = i === active ? 'active' : '';
    tabsHtml += '<div class="tab ' + ac + '" onclick="go(' + i + ')">'
      + '<div class="tab-day">Day ' + d.day + '</div>'
      + '<div class="tab-date">' + d.date + '</div>'
      + '</div>';
  }
  tabsEl.innerHTML = tabsHtml;

  var cur = DAYS[active];
  var html = '';

  // Day header
  html += '<div class="day-header">';
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;">';
  html += '<div>';
  html += '<div class="day-num">' + cur.day + '<span> / 4</span></div>';
  html += '<div class="day-weekday">' + cur.date + ' · ' + cur.weekday + '</div>';
  html += '<div class="day-subtitle">' + cur.subtitle + '</div>';
  html += '</div>';
  html += '<div style="font-size:40px;padding-top:8px;">🏖️</div>';
  html += '</div>';

  if (cur.hotel) {
    html += '<div class="day-hotel">';
    html += '<div class="hotel-label">🛌 住宿</div>';
    html += '<div class="hotel-name">' + cur.hotel.name + '</div>';
    html += '<div style="font-size:11px;color:#7A6A5A;margin-bottom:2px;">' + cur.hotel.rooms + '</div>';
    html += '<div class="hotel-price">' + cur.hotel.price + '</div>';
    html += '<div class="hotel-note">' + cur.hotel.note + '</div>';
    if (cur.hotel.map) {
      html += '<a class="map-btn" href="' + cur.hotel.map + '" target="_blank" style="margin-top:8px;">📍 地圖</a>';
    }
    html += '</div>';
  }
  html += '</div>';

  // Timeline
  html += '<div class="timeline">';
  for (var j = 0; j < cur.items.length; j++) {
    var item = cur.items[j];
    var dotCls = item.dot === 'yellow' ? 'tl-dot yellow' : 'tl-dot';
    var cardCls = item.dot === 'yellow' ? 'tl-card highlight' : 'tl-card';

    html += '<div class="tl-item">';
    html += '<div class="tl-time">' + item.time + '</div>';
    html += '<div class="tl-dot-wrap"><div class="' + dotCls + '"></div></div>';
    html += '<div class="' + cardCls + '">';

    // Tags
    var tagHtml = '';
    for (var t = 0; t < item.tags.length; t++) {
      tagHtml += '<span class="tag ' + item.tags[t].cls + '">' + item.tags[t].txt + '</span>';
    }
    html += '<div>' + tagHtml + '</div>';

    html += '<div class="card-title">' + item.title + '</div>';
    html += '<div class="card-sub">' + item.sub + '</div>';

    for (var k = 0; k < item.info.length; k++) {
      html += '<div class="card-info">' + item.info[k] + '</div>';
    }

    if (item.tip) {
      html += '<div class="tip-box"><p><span class="tip-icon">💡</span>' + item.tip + '</p></div>';
    }

    if (item.map) {
      html += '<a class="map-btn" href="' + item.map + '" target="_blank">📍 地圖</a>';
    }
    if (item.link) {
      html += '<a class="map-btn" href="' + item.link + '" target="_blank" style="margin-left:6px;">🔗 ' + item.linkLabel + '</a>';
    }
    if (item.alt) {
      html += '<div style="margin-top:10px;padding-top:10px;border-top:1px dashed #E0D8D0;">';
      html += '<div style="font-size:11px;color:#9E8E80;margin-bottom:4px;">或</div>';
      html += '<div style="font-size:14px;font-weight:800;color:#4A3A2A;">' + item.alt.title + '</div>';
      html += '<div style="font-size:12px;color:#8A7A6A;margin-bottom:6px;">' + item.alt.sub + '</div>';
      if (item.alt.map) html += '<a class="map-btn" href="' + item.alt.map + '" target="_blank">📍 地圖</a>';
      html += '</div>';
    }

    html += '</div></div>';
  }
  html += '</div>';



  contentEl.innerHTML = html;
}

function go(i) { active = i; render(); setTimeout(function(){ initMap(i); }, 100); }
render();
setTimeout(function(){ initMap(0); }, 300);


</script>
